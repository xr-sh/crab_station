server:
  port: 8080

spring:
  application:
    name: auth-demo

  datasource:
    url: jdbc:mysql://localhost:3306/crab_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# JWT配置
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000  # 24小时，单位毫秒
  header: Authorization
  prefix: "Bearer "

# 日志配置
logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG
